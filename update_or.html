<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل بيانات الطلب - Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

<div class="max-w-5xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-200">
    <!-- الهيدر واختيار الطلب الحقيقي -->
    <div class="flex flex-col md:flex-row justify-between items-center pb-6 mb-6 border-b border-gray-200 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">تعديل الطلب #<span id="display-order-id" class="text-blue-600">---</span></h1>
            <p class="text-sm text-gray-500">إدارة البيانات المرتبطة برقم الطلب id_web_order</p>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-2 w-full md:w-auto">
            <!-- قائمة منسدلة لاختيار أحدث الطلبات الحقيقية -->
            <select id="orders-dropdown" onchange="onOrderDropdownChange(this)" class="border rounded-lg p-2 text-sm w-full sm:w-48 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">-- جاري تحميل الطلبات --</option>
            </select>
            
            <div class="flex gap-2 w-full sm:w-auto">
                <input type="number" id="search-order-id" placeholder="id_web_order" class="border rounded-lg p-2 text-sm w-full sm:w-32 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="button" onclick="loadOrderData(document.getElementById('search-order-id').value)" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition flex-shrink-0">
                    <i class="fas fa-search ml-1"></i> جلب
                </button>
            </div>
        </div>
    </div>

    <!-- شريط التنبيهات والأخطاء -->
    <div id="status-message" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

    <form id="order-form" onsubmit="handleFormSubmit(event)">
        <!-- 1. بيانات العميل من جدول web_orders -->
        <div class="mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-r-4 border-blue-600 pr-2">بيانات العميل (web_orders)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">اسم العميل (client_name)</label>
                    <input type="text" id="client_name" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">رقم الهاتف (client_phone)</label>
                    <input type="text" id="client_phone" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">الهاتف الاحتياطي (client_second_phone)</label>
                    <input type="text" id="client_second_phone" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">العنوان (client_address)</label>
                    <input type="text" id="client_address" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
        </div>

        <!-- 2. تفاصيل المنتجات من جدول web_order_details وجدول products -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700 border-r-4 border-blue-600 pr-2">المنتجات (web_order_details)</h2>
                <button type="button" onclick="addProductRow()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-green-700 transition">
                    <i class="fas fa-plus ml-1"></i> إضافة منتج
                </button>
            </div>

            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                <table class="w-full text-right text-sm">
                    <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                        <tr>
                            <th class="p-3">المنتج</th>
                            <th class="p-3 w-28 text-center">الكمية (qte)</th>
                            <th class="p-3 w-32 text-center">السعر (price)</th>
                            <th class="p-3 w-32 text-center">المجموع (amount)</th>
                            <th class="p-3 w-32 text-center">العمولة (commission)</th>
                            <th class="p-3 w-16 text-center">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body" class="divide-y divide-gray-200">
                        <!-- تُضاف المنتجات ديناميكياً بواسطة السكربت -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. الحسابات والتفاصيل المالية -->
        <div class="bg-gray-50 p-4 rounded-lg flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 border border-gray-200">
            <div class="text-gray-700 text-sm">
                إجمالي العمولات: <span id="total-commission" class="font-bold text-gray-900 text-base mr-1">0.00</span>
            </div>
            <div class="text-gray-800 font-bold text-lg">
                المبلغ الإجمالي (total_amount): <span id="total-amount" class="text-blue-600 text-xl mr-1">0.00</span>
            </div>
        </div>

        <!-- أزرار الحفظ والتحكم -->
        <div class="flex justify-end gap-3">
            <button type="button" onclick="resetForm()" class="bg-gray-200 text-gray-700 px-5 py-2.5 rounded-lg text-sm hover:bg-gray-300">إلغاء</button>
            <button type="submit" id="submit-btn" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 shadow-sm transition">
                حفظ التعديلات
            </button>
        </div>
    </form>
</div>

<script>
// 1. تهيئة الاتصال بقاعدة بيانات Supabase
const SUPABASE_URL = 'https://ihlwkwiimimoiplfqcdk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let productsList = [];
let currentOrderId = null;

// 2. تحميل البيانات الأساسية عند فتح الصفحة
window.addEventListener('DOMContentLoaded', async () => {
    console.log("تجهيز التطبيق للاتصال بـ Supabase...");
    
    // جلب قائمة المنتجات وقائمة أحدث الطلبات
    await fetchProducts();
    await fetchOrdersDropdown();

    // فحص إذا كان رقم الطلب محدداً في رابط الرابط (URL Query)
    const urlParams = new URLSearchParams(window.location.search);
    const orderIdParam = urlParams.get('id');

    if (orderIdParam) {
        document.getElementById('search-order-id').value = orderIdParam;
        await loadOrderData(orderIdParam);
    } else {
        // جلب أحدث طلب تلقائياً في حال عدم تحديد id_web_order بطلب مباشر
        await loadLatestOrder();
    }
});

// جلب المنتجات المتاحة من جدول products
async function fetchProducts() {
    try {
        const { data, error } = await supabase
            .from('products')
            .select('id_product, product_name, seal_price, commission');

        if (error) throw error;
        productsList = data || [];
        console.log('المنتجات المتاحة:', productsList);
    } catch (err) {
        console.error('خطأ جلب المنتجات:', err);
        showMessage(`فشل جلب جدول المنتجات (products): ${err.message}`, 'error');
    }
}

// جلب أحدث قائمة من id_web_order للتسهيل في قائمة الاختيار المنسدلة
async function fetchOrdersDropdown() {
    try {
        const { data: orders, error } = await supabase
            .from('web_orders')
            .select('id_web_order, client_name, total_amount')
            .order('id_web_order', { ascending: false })
            .limit(15);

        if (error) throw error;

        const dropdown = document.getElementById('orders-dropdown');
        if (orders && orders.length > 0) {
            dropdown.innerHTML = '<option value="">-- اختر طلب حقيقي --</option>' +
                orders.map(o => `<option value="${o.id_web_order}">طلب #${o.id_web_order} - ${o.client_name || 'بدون اسم'}</option>`).join('');
        } else {
            dropdown.innerHTML = '<option value="">لا توجد طلبات في web_orders</option>';
        }
    } catch (err) {
        console.error('خطأ جلب القائمة المنسدلة للطلبات:', err);
    }
}

// تحميل أحدث طلب موجود في قاعدة البيانات تلقائياً
async function loadLatestOrder() {
    try {
        const { data, error } = await supabase
            .from('web_orders')
            .select('id_web_order')
            .order('id_web_order', { ascending: false })
            .limit(1)
            .maybeSingle();

        if (error) throw error;

        if (data && data.id_web_order) {
            document.getElementById('search-order-id').value = data.id_web_order;
            await loadOrderData(data.id_web_order);
        } else {
            showMessage('جدول web_orders لا يحتوي على أي طلبات حقيقية حالياً', 'info');
        }
    } catch (err) {
        console.error('خطأ جلب أحدث طلب:', err);
    }
}

// 3. جلب بيانات طلب حقيقي محدد باستخدام id_web_order
async function loadOrderData(targetOrderId) {
    if (!targetOrderId) {
        showMessage('يرجى إدخال id_web_order صحيح للبحث', 'error');
        return;
    }

    try {
        showMessage(`جاري جلب الطلب id_web_order = ${targetOrderId}...`, 'info');

        // أ) جلب بيانات العميل والطلب من جدول web_orders
        const { data: order, error: orderErr } = await supabase
            .from('web_orders')
            .select('*')
            .eq('id_web_order', targetOrderId)
            .maybeSingle();

        if (orderErr) throw orderErr;

        if (!order) {
            showMessage(`لم يتم العثور على طلب برقم id_web_order = (${targetOrderId})`, 'error');
            return;
        }

        // ب) جلب تفاصيل الطلب والمنتجات من جدول web_order_details
        const { data: details, error: detailsErr } = await supabase
            .from('web_order_details')
            .select('*')
            .eq('id_web_order', targetOrderId);

        if (detailsErr) throw detailsErr;

        // تعبئة البيانات في الصفحة
        currentOrderId = order.id_web_order;
        document.getElementById('display-order-id').textContent = currentOrderId;
        document.getElementById('search-order-id').value = currentOrderId;
        document.getElementById('orders-dropdown').value = currentOrderId;

        document.getElementById('client_name').value = order.client_name || '';
        document.getElementById('client_phone').value = order.client_phone || '';
        document.getElementById('client_second_phone').value = order.client_second_phone || '';
        document.getElementById('client_address').value = order.client_address || '';

        // تفريغ جدول المنتجات القديمة وتعبئتها
        const tbody = document.getElementById('products-table-body');
        tbody.innerHTML = '';

        if (details && details.length > 0) {
            details.forEach(item => addProductRow(item));
        } else {
            addProductRow(); // سطر فارغ للاختيار في حال عدم وجود منتجات سابقة
        }

        recalculateAll();
        showMessage(`تم جلب بيانات الطلب #${currentOrderId} الحقيقية بنجاح`, 'success');
    } catch (err) {
        console.error('فشل جلب البيانات:', err);
        showMessage('حدث خطأ أثناء جلب البيانات: ' + err.message, 'error');
    }
}

// عند اختيار طلب من القائمة المنسدلة
function onOrderDropdownChange(selectEl) {
    if (selectEl.value) {
        loadOrderData(selectEl.value);
    }
}

// 4. بناء صفوف المنتجات وتفاعلاتها
function addProductRow(detailData = null) {
    const tbody = document.getElementById('products-table-body');
    const rowId = 'row_' + Math.random().toString(36).substring(2, 9);

    let productOptions = productsList.map(p => {
        const isSelected = detailData && detailData.id_product == p.id_product ? 'selected' : '';
        return `<option value="${p.id_product}" data-price="${p.seal_price || 0}" data-commission="${p.commission || 0}" ${isSelected}>
                    ${p.product_name}
                </option>`;
    }).join('');

    const rowHTML = `
        <tr id="${rowId}" class="hover:bg-gray-50 transition">
            <td class="p-2">
                <select onchange="onProductSelect(this)" class="product-select w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">-- اختر المنتج --</option>
                    ${productOptions}
                </select>
            </td>
            <td class="p-2">
                <input type="number" min="0.1" step="any" value="${detailData ? detailData.qte : 1}" oninput="calculateRow(this)" class="qte-input w-full border rounded-lg p-2 text-center text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </td>
            <td class="p-2">
                <input type="number" min="0" step="any" value="${detailData ? detailData.price : 0}" oninput="calculateRow(this)" class="price-input w-full border rounded-lg p-2 text-center text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </td>
            <td class="p-2 text-center font-bold text-gray-700 amount-cell">
                ${detailData ? (detailData.amount || 0).toFixed(2) : '0.00'}
            </td>
            <td class="p-2 text-center text-gray-600 commission-cell">
                ${detailData ? (detailData.commission || 0).toFixed(2) : '0.00'}
            </td>
            <td class="p-2 text-center">
                <button type="button" onclick="deleteRow('${rowId}')" class="text-red-500 hover:text-red-700 p-1">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `;

    tbody.insertAdjacentHTML('beforeend', rowHTML);
}

function onProductSelect(selectEl) {
    const row = selectEl.closest('tr');
    const selectedOption = selectEl.options[selectEl.selectedIndex];

    if (selectedOption.value) {
        const defaultPrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;
        row.querySelector('.price-input').value = defaultPrice;
    }
    calculateRow(selectEl);
}

function calculateRow(inputEl) {
    const row = inputEl.closest('tr');
    const selectEl = row.querySelector('.product-select');
    const selectedOption = selectEl.options[selectEl.selectedIndex];

    const qte = parseFloat(row.querySelector('.qte-input').value) || 0;
    const price = parseFloat(row.querySelector('.price-input').value) || 0;
    const unitCommission = parseFloat(selectedOption?.getAttribute('data-commission')) || 0;

    const amount = qte * price;
    const commission = qte * unitCommission;

    row.querySelector('.amount-cell').textContent = amount.toFixed(2);
    row.querySelector('.commission-cell').textContent = commission.toFixed(2);

    recalculateAll();
}

function deleteRow(rowId) {
    const row = document.getElementById(rowId);
    if (row) row.remove();
    recalculateAll();
}

function recalculateAll() {
    let totalAmount = 0;
    let totalCommission = 0;

    document.querySelectorAll('#products-table-body tr').forEach(row => {
        totalAmount += parseFloat(row.querySelector('.amount-cell').textContent) || 0;
        totalCommission += parseFloat(row.querySelector('.commission-cell').textContent) || 0;
    });

    document.getElementById('total-amount').textContent = totalAmount.toFixed(2);
    document.getElementById('total-commission').textContent = totalCommission.toFixed(2);
}

// 5. حفظ التعديلات وحكم الربط التداخلي مع Supabase
async function handleFormSubmit(e) {
    e.preventDefault();

    if (!currentOrderId) {
        showMessage('لا يوجد id_web_order محدد لحفظ التعديلات عليه', 'error');
        return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الحفظ...';

    const clientName = document.getElementById('client_name').value;
    const clientPhone = document.getElementById('client_phone').value;
    const clientSecondPhone = document.getElementById('client_second_phone').value;
    const clientAddress = document.getElementById('client_address').value;
    const totalAmount = parseFloat(document.getElementById('total-amount').textContent) || 0;

    try {
        // تحديث جدول web_orders
        const { error: orderUpdateErr } = await supabase
            .from('web_orders')
            .update({
                client_name: clientName,
                client_phone: clientPhone,
                client_second_phone: clientSecondPhone,
                client_address: clientAddress,
                total_amount: totalAmount
            })
            .eq('id_web_order', currentOrderId);

        if (orderUpdateErr) throw orderUpdateErr;

        // حذف المنتجات القديمة من web_order_details وإعادة إدراج المحدثة
        const { error: deleteErr } = await supabase
            .from('web_order_details')
            .delete()
            .eq('id_web_order', currentOrderId);

        if (deleteErr) throw deleteErr;

        const rows = document.querySelectorAll('#products-table-body tr');
        const newDetails = [];

        rows.forEach(row => {
            const select = row.querySelector('.product-select');
            if (select.value) {
                newDetails.push({
                    id_web_order: currentOrderId,
                    id_product: parseInt(select.value),
                    product_name: select.options[select.selectedIndex].text.trim(),
                    qte: parseFloat(row.querySelector('.qte-input').value) || 0,
                    price: parseFloat(row.querySelector('.price-input').value) || 0,
                    amount: parseFloat(row.querySelector('.amount-cell').textContent) || 0,
                    commission: parseFloat(row.querySelector('.commission-cell').textContent) || 0
                });
            }
        });

        if (newDetails.length > 0) {
            const { error: insertErr } = await supabase
                .from('web_order_details')
                .insert(newDetails);

            if (insertErr) throw insertErr;
        }

        showMessage(`تم تحديث بيانات الطلب #${currentOrderId} بنجاح!`, 'success');
        fetchOrdersDropdown(); // تحديث القائمة المنسدلة
    } catch (err) {
        console.error('خطأ أثناء الحفظ:', err);
        showMessage('تعذر حفظ البيانات: ' + err.message, 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ التعديلات';
    }
}

// 6. دوال التنظيف والإظهار
function showMessage(msg, type) {
    const box = document.getElementById('status-message');
    box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
    
    if (type === 'error') box.classList.add('bg-red-100', 'text-red-700');
    else if (type === 'success') box.classList.add('bg-green-100', 'text-green-700');
    else box.classList.add('bg-blue-100', 'text-blue-700');

    box.textContent = msg;
}

function resetForm() {
    document.getElementById('order-form').reset();
    document.getElementById('products-table-body').innerHTML = '';
    document.getElementById('total-amount').textContent = '0.00';
    document.getElementById('total-commission').textContent = '0.00';
    document.getElementById('display-order-id').textContent = '---';
    currentOrderId = null;
    document.getElementById('status-message').classList.add('hidden');
}
</script>

</body>
</html>
