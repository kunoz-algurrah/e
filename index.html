<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة متجر المبيعات - تسجيل الدخول</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Google Fonts: Plus Jakarta Sans & Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ===== إعادة تعيين وإعدادات أساسية ===== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --accent: #8b5cf6;
    --bg-dark: #0f172a;
    --card-bg: rgba(255, 255, 255, 0.96);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --input-bg: #f8fafc;
    --radius-lg: 24px;
    --radius-md: 14px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
    font-family: 'Cairo', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%),
        url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=1920&auto=format&fit=crop");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text-main);
}

/* ===== الكرت الرئيسي ===== */
.container {
    width: 1050px;
    max-width: 100%;
    min-height: 620px;
    display: flex;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
}

/* ===== الجهة اليسرى (البنر الجانبي) ===== */
.left {
    width: 48%;
    position: relative;
    background: 
        linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 27, 75, 0.85) 100%),
        url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=1200&auto=format&fit=crop") center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px;
    color: white;
    overflow: hidden;
}

.left::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(225deg, rgba(99, 102, 241, 0.4) 0%, rgba(139, 92, 246, 0.2) 100%);
    pointer-events: none;
}

.left-content {
    position: relative;
    z-index: 2;
    margin-top: auto;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    color: #e0e7ff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.left h2 {
    font-size: 34px;
    line-height: 1.35;
    margin-bottom: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.left p {
    font-size: 15px;
    line-height: 1.8;
    color: #cbd5e1;
    font-weight: 400;
}

/* ===== الجهة اليمنى (نموذج تسجيل الدخول) ===== */
.right {
    width: 52%;
    background: var(--card-bg);
    padding: 50px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
}

/* الشعار */
.logo-wrapper {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 12px 25px -6px rgba(99, 102, 241, 0.4);
}

.logo svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
}

/* العناوين */
h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 32px;
    font-size: 14px;
    font-weight: 500;
}

/* تنبيه الخطأ / الرسائل */
.alert-box {
    display: none;
    padding: 12px 16px;
    background-color: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* الحقول */
.input-group {
    margin-bottom: 20px;
}

.label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
}

.input-box {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    right: 16px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: var(--transition);
}

.input-icon svg {
    width: 20px;
    height: 20px;
}

.input-box input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border-color);
    font-size: 14px;
    background: var(--input-bg);
    color: #0f172a;
    transition: var(--transition);
    font-family: inherit;
    font-weight: 500;
}

.input-box input::placeholder {
    color: #94a3b8;
    font-weight: 400;
}

.input-box input:focus {
    outline: none;
    background: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
}

.input-box input:focus + .input-icon {
    color: var(--primary);
}

.toggle-pwd {
    position: absolute;
    left: 16px;
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    box-shadow: none !important;
    margin: 0 !important;
    width: auto !important;
}

.toggle-pwd:hover {
    color: #475569;
    transform: none !important;
}

.toggle-pwd svg {
    width: 20px;
    height: 20px;
}

/* الزر */
button.btn-submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 10px;
    font-family: inherit;
    box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
    background: linear-gradient(135deg, var(--primary-hover) 0%, #7c3aed 100%);
}

button.btn-submit:active {
    transform: translateY(0);
}

button.btn-submit:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

/* Footer */
.footer-text {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
}

/* ===== التجاوب للموبايل والشاشات الصغيرة ===== */
@media(max-width: 950px) {
    .container {
        flex-direction: column;
        min-height: auto;
        border-radius: 20px;
    }

    .left {
        width: 100%;
        min-height: 220px;
        padding: 32px 28px;
    }

    .right {
        width: 100%;
        padding: 36px 24px;
    }

    .left h2 {
        font-size: 26px;
    }

    h1 {
        font-size: 24px;
    }
}

@media(max-width: 480px) {
    body {
        padding: 12px;
    }

    .left {
        min-height: 180px;
        padding: 24px 20px;
    }

    .left h2 {
        font-size: 20px;
        margin-bottom: 8px;
    }

    .left p {
        font-size: 13px;
        line-height: 1.6;
    }

    .brand {
        font-size: 11px;
        margin-bottom: 12px;
        padding: 6px 12px;
    }

    .right {
        padding: 28px 20px;
    }

    .logo {
        width: 54px;
        height: 54px;
        border-radius: 14px;
    }

    .logo svg {
        width: 26px;
        height: 26px;
    }

    h1 {
        font-size: 22px;
    }

    .subtitle {
        font-size: 13px;
        margin-bottom: 24px;
    }

    .input-box input {
        padding: 12px 42px 12px 14px;
        font-size: 13.5px;
    }

    button.btn-submit {
        padding: 13px;
        font-size: 15px;
    }
}

/* تخصيص شريط التمرير */
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

    <!-- الجهة اليسرى (البنر الجانبي) -->
    <div class="left">
        <div class="left-content">
            <div class="brand">
                <span>🚀</span> نظام حديث لإدارة المبيعات
            </div>

            <h2>
                إدارة ذكية<br>
                للمبيعات والمستخدمين
            </h2>

            <p>
                واجهة احترافية متوافقة مع الجوال والأجهزة الحديثة
                لتسهيل إدارة العمليات اليومية بسرعة وأمان.
            </p>
        </div>
    </div>

    <!-- الجهة اليمنى (نموذج الدخول) -->
    <div class="right">

        <div class="logo-wrapper">
            <div class="logo">
                <!-- أيقونة حقيبة أعمال حديثة SVG -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
        </div>

        <h1>تسجيل الدخول</h1>
        <div class="subtitle">مرحباً بك في نظام إدارة المبيعات</div>

        <!-- صندوق التنبيه الأنيق للأخطاء -->
        <div id="alertBox" class="alert-box"></div>

        <div class="input-group">
            <label class="label">اسم المستخدم</label>
            <div class="input-box">
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
                <span class="input-icon">
                    <!-- أيقونة مستخدم -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
            </div>
        </div>

        <div class="input-group">
            <label class="label">كلمة المرور</label>
            <div class="input-box">
                <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                <span class="input-icon">
                    <!-- أيقونة قفل -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <!-- زر إظهار/إخفاء كلمة المرور -->
                <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="إظهار/إخفاء كلمة المرور">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button id="btnLogin" class="btn-submit" onclick="login()">
            <span>تسجيل الدخول</span>
        </button>

        <div class="footer-text">
            جميع الحقوق محفوظة © ABM للبرمجة والتصميم
        </div>

    </div>

</div>

<script>

// استخدام مشروع Supabase الخاص بك المحدث (بدون أي تغيير)
const supabaseClient = window.supabase.createClient(
    "https://ihlwkwiimimoiplfqcdk.supabase.co",
    "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
);

// دعم زر Enter
document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        login();
    }
});

// دالة إظهار/إخفاء كلمة المرور
function togglePasswordVisibility() {
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    } else {
        passwordInput.type = "password";
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
}

// دالة إظهار التنبيهات بطريقة عصرية
function showAlert(message) {
    const alertBox = document.getElementById("alertBox");
    alertBox.textContent = message;
    alertBox.style.display = "block";
}

function hideAlert() {
    const alertBox = document.getElementById("alertBox");
    alertBox.style.display = "none";
}

async function login() {

    hideAlert();

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        showAlert("الرجاء إدخال اسم المستخدم وكلمة المرور");
        return;
    }

    try {
        // تغيير زر الدخول لحالة التحميل
        btnLogin.disabled = true;
        btnLogin.innerHTML = `<span>جاري التحقق...</span>`;

        const { data, error } = await supabaseClient
            .from("tb_users")
            .select("*")
            .eq("username", username)
            .eq("pwd", password)
            .maybeSingle();

        if (error) {
            console.error(error);
            showAlert("حدث خطأ أثناء الاتصال بقاعدة البيانات");
            btnLogin.disabled = false;
            btnLogin.innerHTML = `<span>تسجيل الدخول</span>`;
            return;
        }

        if (!data) {
            showAlert("اسم المستخدم أو كلمة المرور غير صحيحة");
            btnLogin.disabled = false;
            btnLogin.innerHTML = `<span>تسجيل الدخول</span>`;
            return;
        }

        // 1. حفظ كائن المستخدم كاملاً للتعامل معه بسهولة
        localStorage.setItem("user", JSON.stringify(data));

        // 2. حفظ القيم المنفصلة للتوافق مع صفحات قديمة
        localStorage.setItem("userId", data.id || "");
        localStorage.setItem("userName", data.fullname || data.username || "");
        localStorage.setItem("userRole", data.usertype || "");
        localStorage.setItem("bankAccount", data.bank_account || "");

        // التوجيه حسب نوع المستخدم
        const userType = (data.usertype || "").trim();

        switch (userType) {

            case "مسوق":
            case "مدير":
            case "مشرف":
            case "تقني حاسوب":
            case "بائع":
                // التوجيه المباشر للوحة التحكم الرئيسية dashboard.html
                window.location.href = "dashboard.html";
                break;

            default:
                // التوجيه الافتراضي لوحة التحكم الرئيسية
                window.location.href = "dashboard.html";
                break;

        }

    } catch (err) {

        console.error("Login Error:", err);
        showAlert("حدث خطأ أثناء تسجيل الدخول");
        btnLogin.disabled = false;
        btnLogin.innerHTML = `<span>تسجيل الدخول</span>`;

    }

}

</script>

</body>
</html>
