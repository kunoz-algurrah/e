<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر كنوز الغرة للأجهزة الكهربائية والمنزلية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .skeleton { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        /* جعل البطاقة مربعة الشكل بنسبة متساوية */
        .aspect-square { aspect-ratio: 1 / 1; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التواصل السريع -->
    <div class="bg-gray-900 text-white text-xs py-2 px-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="font-semibold text-gray-300">
                ✨ أهلاً بك في متجر كنوز الغرة للأجهزة الكهربائية والمنزلية
            </div>
            <div class="flex items-center gap-4 font-bold">
                <span>للطلب : عبر الواتساب</span>
                <span class="text-gray-700 hidden sm:inline">|</span>
                <a href="https://wa.me/+2491128321170" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                    💬 واتساب مباشر
                </a>
            </div>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showDepartmentsView()">
                <span class="text-2xl">🛍️</span>
                <span class="text-xl font-bold text-blue-600">كنوز الغرة</span>
            </div>
            <a href="cart.html" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-xl transition flex items-center gap-2 font-bold text-sm">
                <span>🛒 سلة المشتريات</span>
                <span id="cartCount" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <!-- الهيدر -->
    <header class="relative bg-gray-900 text-white py-12 px-4 text-center">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=1000&auto=format&fit=crop');"></div>
        <div class="relative max-w-2xl mx-auto z-10">
            <h1 class="text-2xl md:text-4xl font-extrabold mb-2">أحدث الأجهزة المنزلية والكهربائية</h1>
            <p class="text-xs md:text-sm text-gray-300">اختر القسم لمشاهدة جميع المنتجات المتاحة</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- زر العودة للأقسام -->
        <div id="backToDeptsBtn" class="hidden mb-6">
            <button onclick="showDepartmentsView()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2">
                <span>⬅</span> العودة إلى قائمة الأقسام
            </button>
        </div>

        <h2 id="pageTitle" class="text-xl md:text-2xl font-bold mb-6 text-gray-800">📂 أقسام المتجر</h2>

        <!-- 1. شبكة الأقسام المربعة -->
        <div id="departmentsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="bg-white rounded-2xl skeleton aspect-square"></div>
            <div class="bg-white rounded-2xl skeleton aspect-square"></div>
            <div class="bg-white rounded-2xl skeleton aspect-square"></div>
            <div class="bg-white rounded-2xl skeleton aspect-square hidden sm:block"></div>
        </div>

        <!-- 2. شبكة المنتجات (تظهر فقط عند اختيار قسم) -->
        <div id="productsGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

    </main>

    <script>
        const supabaseClient = supabase.createClient(
            "https://ihlwkwiimimoiplfqcdk.supabase.co",
            "sb_publishable_Yr8COAP3Hp_cibgD1wdQZg_Ic9zZEoK"
        );

        let products = [];
        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from("products")
                    .select("id_product, product_name, seal_price, qte_in_stock, image_url, department");
                
                if (!error && data && data.length > 0) {
                    products = data;
                } else {
                    throw new Error("لا توجد بيانات");
                }
            } catch (error) {
                console.warn("بيانات احتياطية:", error.message);
                products = [
                    { id_product: 101, product_name: "ثلاجة 16 قدم", seal_price: 250000, qte_in_stock: 5, department: "أجهزة منزلية" },
                    { id_product: 102, product_name: "شاشة 55 بوصة Smart", seal_price: 180000, qte_in_stock: 3, department: "شاشات وإلكترونيات" },
                    { id_product: 103, product_name: "خلاط كهربائي", seal_price: 35000, qte_in_stock: 8, department: "أجهزة المطبخ" },
                    { id_product: 104, product_name: "مكيف هواء", seal_price: 320000, qte_in_stock: 4, department: "التكييف والتبريد" }
                ];
            }

            renderDepartmentsView();
            updateCartCount();
        }

        // 1. عرض بطاقات الأقسام بتصميم مربع (Square Box)
        function renderDepartmentsView() {
            document.getElementById("pageTitle").innerText = "📂 أقسام المتجر الرئيسية";
            document.getElementById("backToDeptsBtn").classList.add("hidden");
            document.getElementById("productsGrid").classList.add("hidden");
            document.getElementById("departmentsGrid").classList.remove("hidden");

            const deptCounts = {};
            products.forEach(p => {
                if ((Number(p.qte_in_stock) || 0) > 0) {
                    const dept = p.department || "أقسام أخرى";
                    deptCounts[dept] = (deptCounts[dept] || 0) + 1;
                }
            });

            const departments = Object.keys(deptCounts);

            if (departments.length === 0) {
                document.getElementById("departmentsGrid").innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">لا توجد أقسام متاحة حالياً.</div>`;
                return;
            }

            let html = "";
            departments.forEach(dept => {
                const count = deptCounts[dept];
                html += `
                <div onclick="selectDepartment('${dept}')" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:border-blue-500 hover:shadow-md transition cursor-pointer flex flex-col justify-between items-center text-center aspect-square group">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-2xl text-blue-600 mt-2 group-hover:scale-110 transition duration-200">
                        📦
                    </div>
                    <div>
                        <h3 class="font-bold text-sm md:text-base text-gray-800 group-hover:text-blue-600 transition line-clamp-2">${dept}</h3>
                        <span class="inline-block mt-1 bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full font-semibold">
                            ${count} منتج
                        </span>
                    </div>
                    <div class="text-xs font-bold text-blue-600 flex items-center gap-1 opacity-80 group-hover:opacity-100">
                        عرض المنتجات ⬅
                    </div>
                </div>`;
            });

            document.getElementById("departmentsGrid").innerHTML = html;
        }

        // 2. عرض منتجات القسم المحدد
        function selectDepartment(deptName) {
            document.getElementById("pageTitle").innerText = `📦 منتجات قسم: ${deptName}`;
            document.getElementById("departmentsGrid").classList.add("hidden");
            document.getElementById("backToDeptsBtn").classList.remove("hidden");
            document.getElementById("productsGrid").classList.remove("hidden");

            const filteredProducts = products.filter(p => 
                (Number(p.qte_in_stock) || 0) > 0 && 
                (p.department || "أقسام أخرى") === deptName
            );

            let html = "";
            let fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=500";

            if (filteredProducts.length === 0) {
                document.getElementById("productsGrid").innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">لا توجد منتجات متوفرة في هذا القسم.</div>`;
                return;
            }

            filteredProducts.forEach(p => {
                let price = Number(p.seal_price) || 0;
                let productName = p.product_name || "منتج غير مسمى";
                let imgUrl = p.image_url || fallbackImg;

                html += `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between p-4 hover:shadow-md transition">
                    <img src="${imgUrl}" alt="${productName}" class="w-full h-48 object-cover rounded-xl bg-gray-100 mb-3" loading="lazy" onerror="this.src='${fallbackImg}'">
                    <div class="flex-1 flex flex-col justify-between gap-2">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${productName}</h3>
                            <div class="text-blue-600 font-extrabold text-base mt-1">${price.toFixed(2)} ج.س</div>
                        </div>
                        <button onclick="addToCart(${p.id_product})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl transition text-xs mt-2">
                            ➕ إضافة للسلة
                        </button>
                    </div>
                </div>`;
            });

            document.getElementById("productsGrid").innerHTML = html;
        }

        function showDepartmentsView() {
            renderDepartmentsView();
        }

        function addToCart(id) {
            const product = products.find(p => p.id_product === id);
            if (!product) return;

            const existingItem = cart.find(item => item.id_product === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ 
                    id_product: product.id_product,
                    product_name: product.product_name,
                    seal_price: Number(product.seal_price) || 0,
                    quantity: 1 
                });
            }
            localStorage.setItem('customerCart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById("cartCount").innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        fetchProducts();
    </script>
</body>
</html>
