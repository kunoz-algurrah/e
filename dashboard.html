<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة الشاملة</title>
    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .iframe-container { height: calc(100vh - 65px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden">

    <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-4 z-20 shadow-md">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="md:hidden text-gray-300 hover:text-white focus:outline-none text-xl p-1">
                ☰
            </button>
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 text-white font-black text-xs p-1.5 rounded-lg">SYS</span>
                <h1 class="font-bold text-sm sm:text-base tracking-wide">نظام الإدارة والطلبات</h1>
            </div>
        </div>

        <div class="flex items-center gap-3 text-xs">
            <div class="text-right hidden sm:block">
                <div id="loggedUserName" class="font-bold text-white">المستخدم الحالي</div>
                <div id="loggedUserAccount" class="text-gray-400 text-[10px] dir-ltr">الحساب البنكي: -</div>
            </div>
            <button onclick="reloadIframe()" title="تحديث الصفحة الحالية" class="bg-slate-800 hover:bg-slate-700 text-gray-200 p-2 rounded-xl transition">
                🔄
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <aside id="sidebar" class="bg-slate-800 text-slate-200 w-64 flex-shrink-0 flex flex-col justify-between absolute md:relative inset-y-0 right-0 transform translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out z-10 shadow-lg md:shadow-none">
            <div class="p-3 space-y-1 overflow-y-auto">
                <div class="text-[10px] font-bold text-slate-400 px-3 py-2 uppercase tracking-wider">الأقسام الرئيسية</div>

                <a href="#" onclick="loadPage('store.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs hover:bg-slate-700/60 hover:text-white transition active-link bg-blue-600 text-white">
                    <span class="text-base">🏪</span> المتجر الرئيسي
                </a>

                <a href="#" onclick="loadPage('web_admin.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-slate-700/60 hover:text-white transition">
                    <span class="text-base">📦</span> إدارة الطلبات
                </a>

               
                <a href="#" onclick="loadPage('update_or.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-slate-700/60 hover:text-white transition">
                    <span class="text-base">🗂️</span> معالجات  
                </a>

                <a href="#" onclick="loadPage('products.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-slate-700/60 hover:text-white transition">
                    <span class="text-base">🏷️</span> إدارة المنتجات
                </a>

                <a href="#" onclick="loadPage('categories.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-slate-700/60 hover:text-white transition">
                    <span class="text-base">📂</span> تصنيفات المنتجات
                </a>

                <a href="#" onclick="loadPage('tb_users.html', this)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300 hover:bg-slate-700/60 hover:text-white transition">
                    <span class="text-base">👥</span> المستخدمين والمسوقين
                </a>
            </div>

            <div class="p-3 border-t border-slate-700/50">
                <a href="#" onclick="openExternalStore()" class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-700/40 transition">
                    <span>عرض المتجر نافذة جديدة</span>
                    <span>↗️</span>
                </a>
            </div>
        </aside>

        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-0 hidden md:hidden"></div>

        <main class="flex-1 bg-slate-100 overflow-hidden relative">
            <iframe id="mainFrame" src="store.html" class="w-full iframe-container border-0" title="المحتوى الرئيسي"></iframe>
        </main>

    </div>

    <script>
        // تحميل بيانات المستخدم الحالية إن وجدت في LocalStorage
        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if(user && (user.fullname || user.username)) {
                document.getElementById('loggedUserName').textContent = user.fullname || user.username;
                document.getElementById('loggedUserAccount').textContent = 'حساب بنكي: ' + (user.bank_account || 'غير مسجل');
            }
        };

        // دالة التنقل بين الصفحات وتحديث الألوان
        function loadPage(pageUrl, element) {
            document.getElementById('mainFrame').src = pageUrl;

            // تحديث التحديد على القائمة الجانبية
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('bg-blue-600', 'text-white');
                item.classList.add('text-slate-300');
            });

            if (element) {
                element.classList.add('bg-blue-600', 'text-white');
                element.classList.remove('text-slate-300');
            }

            // إغلاق القائمة في الجوال عند الاختيار
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        // إغلاق وفتح القائمة الجانبية للشاشات الصغيرة
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // تحديث الإطار الحالي
        function reloadIframe() {
            const iframe = document.getElementById('mainFrame');
            iframe.src = iframe.src;
        }

        // فتح المتجر في نافذة مستقلة
        function openExternalStore() {
            window.open('store.html', '_blank');
        }
    </script>
</body>
</html>
